name: resolve-airport-ip

on:
  # 定时任务已停用：避免高频查询机场私有 DNS，被误判为恶意请求。
  # 现在只在两种情况下运行：
  #   1. 本地看门狗检测到当前代理失效，推一个空提交触发一次；
  #   2. 在 Actions 页面手动 Run workflow。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-airport-ip
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve airport IP
        env:
          XDM_DOMAIN: f615b7dd813b85dc2c8584e558019a6deef99c59d8f06b.xingdaomeng.lky
          XDM_DNS: "43.108.56.44"
          XDM_PORTS: "30101,30402,30004"
          EDGE_DOMAIN: bianasfdloo.bianyuan99.net
          EDGE_DNS: "47.80.244.10"
          EDGE_PORTS: "46101,46301,46501"
        run: |
          python resolve_ip.py > ip.json.tmp
          mv ip.json.tmp ip.json

      - name: Commit ip.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ip.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update airport ip [skip ci]"
            git push
          fi
